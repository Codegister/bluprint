<body>
  <!--
    First-paint loader. The bundle takes a moment to arrive, and the marketing
    page is the first thing a visitor sees, so it must never be a blank screen.
    This is static markup with inline styles (no stylesheet is loaded yet) and
    React replaces it the moment it mounts into #root.
  -->
  <div id="root">
    <div class="boot-loader" role="status" aria-live="polite">
      <style>
        .boot-loader {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #0c0708;
          font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
          color: #f6f1e8;
        }
        .boot-loader__mark {
          font-family: "Fraunces", Georgia, serif;
          font-size: 28.125px;
          font-weight: 500;
          letter-spacing: -0.04em;
        }
        .boot-loader__bar {
          width: 168px;
          height: 2px;
          overflow: hidden;
          background: #2b2320;
        }
        .boot-loader__bar span {
          display: block;
          width: 40%;
          height: 100%;
          background: #9eb07a;
          animation: boot-slide 1.15s ease-in-out infinite;
        }
        .boot-loader__text {
          color: #b8afa5;
          font-size: 18px;
        }
        @keyframes boot-slide {
          0% {
            transform: translateX(-100%);
          }
          100% {
            transform: translateX(250%);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          .boot-loader__bar span {
            animation: none;
            width: 100%;
          }
        }
      </style>
      <p class="boot-loader__mark">Bluprint</p>
      <div class="boot-loader__bar"><span></span></div>
      <p class="boot-loader__text">Opening your study space…</p>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
