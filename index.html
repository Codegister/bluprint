<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f6f8" />
  <meta
    name="description"
    content="Bluprint turns your notes into summaries, flashcards, quizzes and AI-marked exam questions."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <title>Bluprint — notes in, revision out</title>
</head>


<body>
  <div id="root"></div>
  <script type="module">
    // Mark the document as live before the React bundle arrives. Keeping this
    // inline also gives Vite a stable third HTML proxy module, so a preview tab
    // left open across an index.html edit cannot request a missing proxy.
    document.documentElement.dataset.bluprintBoot = "true";
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
