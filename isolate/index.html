<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#eef2f6" />
  <meta name="color-scheme" content="light dark" />
  <meta
    name="description"
    content="Bluprint turns your notes into summaries, flashcards, quizzes and AI-marked exam questions."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <title>Bluprint: notes in, revision out</title>
  <!--
    Apply the stored theme before React mounts so the first paint is already
    light or dark. Until the student picks a side, the OS preference wins.
    ThemeProvider in src/components/ThemeProvider.tsx owns every later change.
  -->
  <script>
    (function () {
      try {
        var stored = window.localStorage.getItem("bluprint.theme");
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (error) {
        /* Storage can be blocked; the light sheet is the safe default. */
      }
    })();
  </script>
  <script type="module" crossorigin src="/assets/index-BSBLiPnh.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/react-vendor-DzeyujRg.js">
  <link rel="modulepreload" crossorigin href="/assets/framer-motion-8LdQ7a12.js">
  <link rel="modulepreload" crossorigin href="/assets/radix-ui-C71IlOJC.js">
  <link rel="modulepreload" crossorigin href="/assets/charts-C1ckgCBe.js">
  <link rel="stylesheet" crossorigin href="/assets/index-9DfcF0ZC.css">
</head>

<body>
  <!--
    First-paint loader. The bundle takes a moment to arrive, and the marketing
    page is the first thing a visitor sees, so it must never be a blank screen.
    This is static markup with inline styles (no stylesheet is loaded yet) and
    React replaces it the moment it mounts into #root.
  -->
  <div id="root">
    <div class="boot-loader" role="status" aria-live="polite">
      <style>
        .boot-loader {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #eef2f6;
          font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
          color: #111;
        }
        html.dark .boot-loader {
          background: #101216;
          color: #f5f7fa;
        }
        .boot-loader__mark {
          font-size: 1.35rem;
          font-weight: 700;
          letter-spacing: -0.02em;
        }
        .boot-loader__bar {
          width: 168px;
          height: 4px;
          border-radius: 999px;
          overflow: hidden;
          background: rgba(17, 17, 17, 0.1);
        }
        html.dark .boot-loader__bar {
          background: rgba(245, 247, 250, 0.16);
        }
        .boot-loader__bar span {
          display: block;
          width: 40%;
          height: 100%;
          border-radius: 999px;
          background: #7dd3fc;
          animation: boot-slide 1.15s ease-in-out infinite;
        }
        .boot-loader__text {
          font-size: 0.8rem;
          opacity: 0.6;
        }
        @keyframes boot-slide {
          0% {
            transform: translateX(-100%);
          }
          100% {
            transform: translateX(250%);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          .boot-loader__bar span {
            animation: none;
            width: 100%;
          }
        }
      </style>
      <p class="boot-loader__mark">Bluprint</p>
      <div class="boot-loader__bar"><span></span></div>
      <p class="boot-loader__text">Loading your study space…</p>
    </div>
  </div>
</body>

</html>
