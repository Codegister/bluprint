name: Check

# Typechecking needs the generated Convex client (`src/convex/_generated/`),
# which `convex codegen` produces and which needs a deployment key, so it is
# not committed. This workflow is deliberately separate from the Pages deploy:
# a missing or expired key can never stop the site from publishing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate Convex client
        # Add CONVEX_DEPLOY_KEY under Settings -> Secrets and variables ->
        # Actions (Convex dashboard: the deployment's Settings -> Deploy keys).
        # The key must target the deployment pinned in src/main.tsx. Without a
        # key the generated types do not exist, so the typecheck below says so
        # instead of failing.
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          key="$(printf '%s' "${CONVEX_DEPLOY_KEY:-}" | tr -d '[:space:]')"
          if [ -z "$key" ]; then
            echo "::warning::CONVEX_DEPLOY_KEY is not set; skipping generated Convex types and the typecheck."
            exit 0
          fi
          export CONVEX_DEPLOY_KEY="$key"
          bash .github/scripts/check-convex-key.sh
          export CONVEX_DEPLOY_KEY="$(cat "${RUNNER_TEMP:-/tmp}/convex-deploy-key")"
          set +e
          output="$(bunx convex codegen --typecheck disable 2>&1)"
          status=$?
          output="$(printf '%s\n' "$output" | sed "s#$CONVEX_DEPLOY_KEY#***#g")"
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            detail="$(printf '%s\n' "$output" | grep -m1 -E '✖|Error|error|Invalid' || true)"
            echo "::error title=Convex codegen failed::${detail:-The CLI exited $status. See the job log.}"
            exit "$status"
          fi

      - name: Typecheck
        run: |
          if [ ! -f src/convex/_generated/api.d.ts ]; then
            echo "::warning::No generated Convex types; skipping tsc -b."
            exit 0
          fi
          bunx tsc -b

      - name: Tests
        run: bun test
