name: Deploy Convex backend

# Deploys the backend when Convex functions change on main. The deploy key
# lives only in repository secrets; workflow_dispatch allows a deliberate
# re-run without another commit.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/convex/**"
      - ".github/workflows/convex.yml"

permissions:
  contents: read

concurrency:
  group: convex-production
  cancel-in-progress: false

jobs:
  deploy:
    name: convex deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check deploy key
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY is not set in repository secrets."
            exit 1
          fi

      - name: Deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          # A copy/pasted secret can keep a trailing newline; the CLI treats
          # that as part of the key.
          export CONVEX_DEPLOY_KEY="$(printf '%s' "$CONVEX_DEPLOY_KEY" | tr -d '\r\n')"
          # Convex deploy typechecks before it regenerates `src/convex/_generated`,
          # which is gitignored, so a clean checkout fails that step even when the
          # functions are valid. The Check workflow runs codegen and a real
          # typecheck with the same key; this step only ships the code.
          bunx convex deploy --yes --typecheck disable
