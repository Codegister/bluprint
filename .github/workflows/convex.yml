name: Deploy Convex backend

# Deploys the backend when Convex functions change on main. The deploy key
# lives only in repository secrets; workflow_dispatch allows a deliberate
# re-run without another commit.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/convex/**"
      - ".github/workflows/convex.yml"

permissions:
  contents: read

concurrency:
  group: convex-production
  cancel-in-progress: false

jobs:
  deploy:
    name: convex deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Validate deploy key
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          # A copy/pasted secret can carry whitespace; the CLI treats it as part
          # of the key. This also refuses a key for a different deployment,
          # which would deploy the fix to a backend the app never talks to.
          export CONVEX_DEPLOY_KEY="$(printf '%s' "${CONVEX_DEPLOY_KEY:-}" | tr -d '[:space:]')"
          bash .github/scripts/check-convex-key.sh

      - name: Deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          set +e
          export CONVEX_DEPLOY_KEY="$(printf '%s' "${CONVEX_DEPLOY_KEY:-}" | tr -d '[:space:]')"
          # `convex deploy` has no --yes flag in this CLI; it is non-interactive
          # in CI. Typechecking is disabled here because it runs before the
          # gitignored `src/convex/_generated` client is regenerated; the Check
          # workflow runs codegen and tsc against the same deployment.
          output="$(bunx convex deploy --typecheck disable 2>&1)"
          status=$?
          output="$(printf '%s\n' "$output" | sed "s#$CONVEX_DEPLOY_KEY#***#g")"
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            detail="$(printf '%s\n' "$output" | grep -m1 -E '✖|Error|error|Invalid' || true)"
            echo "::error title=Convex deploy failed::${detail:-The CLI exited $status. See the job log.}"
            exit "$status"
          fi
