name: Deploy to GitHub Pages

# The frontend is static; Convex hosts the database, auth and AI actions.
# NVIDIA_API_KEY stays on the Convex deployment and is never needed here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Require patched production backend
        # The client now points at the production deployment. Publishing it
        # before that deployment has the OTP fix would move users onto an
        # unpatched backend, so the build stops here until the old public
        # status query stops answering for an arbitrary address. The probe is
        # read-only and uses a reserved invalid address.
        run: |
          url="$(grep -m1 -oE 'https://[a-z0-9-]+\.convex\.cloud' src/main.tsx || true)"
          if [ -z "$url" ]; then
            echo "::error title=No Convex URL::src/main.tsx has no https://<deployment>.convex.cloud URL."
            exit 1
          fi
          body="$(curl -sS -X POST "$url/api/query" \
            -H 'Content-Type: application/json' \
            --data '{"path":"otpGuard:status","args":{"email":"security-probe@example.invalid"},"format":"json"}')" || {
            echo "::error title=Production backend unreachable::The frontend points at $url."
            exit 1
          }
          if ! printf '%s' "$body" | jq -e . >/dev/null 2>&1; then
            echo "::error title=Production backend returned non-JSON::The frontend points at $url."
            exit 1
          fi
          if printf '%s' "$body" | jq -e '.status == "success" and (.value.attemptsLeft != null)' >/dev/null; then
            echo "::error title=Production backend is not patched::otpGuard:status still answers for an arbitrary address. Deploy the fixed Convex backend first, then re-run this workflow."
            exit 1
          fi
          echo "Production backend no longer answers otpGuard:status for an arbitrary address."

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Convex client module
        # `src/convex/_generated/` is written by `convex codegen`, which needs
        # an authenticated Convex deployment, so it is not committed. The
        # generated runtime module is a thin proxy over `anyApi`, so the build
        # only needs that proxy to exist. A checkout that has already run
        # `bunx convex dev` has the real typed file and keeps it.
        run: |
          mkdir -p src/convex/_generated
          if [ ! -f src/convex/_generated/api.ts ]; then
            printf '%s\n' \
              '// Placeholder for the Pages build: `bunx convex dev` replaces this' \
              '// with the generated, typed client. See .github/workflows/deploy.yml.' \
              'import { anyApi } from "convex/server";' \
              'export const api = anyApi;' \
              'export const internal = anyApi;' \
              > src/convex/_generated/api.ts
          fi

      - name: Build
        # A project site lives at /<repo>/, a user site at /. Deriving the base
        # here keeps vite.config.ts unchanged for local development.
        run: |-
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then
            BASE="/"
          else
            BASE="/$REPO/"
          fi
          echo "Building with base $BASE"
          bunx vite build --base="$BASE"

      - name: SPA fallback
        # GitHub Pages has no rewrite rules. A copy of the shell at 404.html
        # lets a deep link such as /today load the app, which then routes it.
        run: |
          cp dist/index.html dist/404.html
          # Deep links are served through 404.html on Pages. They are real app
          # routes, not missing pages, but a crawler must not index the shell at
          # every path; share and auth routes are private anyway.
          sed -i 's#</head>#  <meta name="robots" content="noindex, nofollow" />\n</head>#' dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
