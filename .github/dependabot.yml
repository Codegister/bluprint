version: 2

updates:
  # The app installs with `bun install` and commits bun.lock, so Dependabot
  # updates that lockfile rather than a package-lock.json that does not exist.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
